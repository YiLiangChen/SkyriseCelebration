<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蒼天街復興慶典計時鐘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap');
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .bg-fete { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            background-attachment: fixed;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .badge-active {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.1);
        }
        .badge-cooldown {
            background: rgba(148, 163, 184, 0.05);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #94a3b8;
        }
    </style>
</head>
<body class="bg-fete text-gray-100 min-h-screen p-4 md:p-12 flex items-center justify-center">

    <div class="max-w-3xl w-full">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-bold text-sky-400 tracking-tight text-shadow-lg">蒼天街復興慶典</h1>
            <p class="text-slate-500 text-xs mt-2 tracking-[0.2em] uppercase">Ishgardian Skyrise Celebration</p>
        </header>

        <div class="glass rounded-2xl shadow-2xl overflow-hidden">
            <table class="w-full border-collapse">
                <thead class="bg-white/5 text-slate-400 text-sm uppercase tracking-wider">
                    <tr>
                        <th class="px-8 py-5 text-left font-semibold">伺服器</th>
                        <th class="px-8 py-5 text-left font-semibold">階段狀態</th>
                        <th class="px-8 py-5 text-right font-semibold whitespace-nowrap">FATE 倒數</th>
                    </tr>
                </thead>
                <tbody id="serverTableBody" class="divide-y divide-white/5">
                    </tbody>
            </table>
        </div>
        <footer class="mt-8 text-center">
            <div class="flex justify-center items-center space-x-8 text-[11px] text-slate-500">
                <div class="flex items-center">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 shadow-[0_0_8px_rgba(34,197,94,0.6)] animate-pulse"></span> 
                    慶典進行中
                </div>
                <div class="flex items-center">
                    <span class="w-2 h-2 bg-slate-500 rounded-full mr-2"></span> 
                    冷卻休息中
                </div>
            </div>

            <div class="mt-4 text-[12px] text-slate-400 tracking-wider">
                * 目前僅「迦樓羅」伺服器完成時間校對，其餘伺服器待完成後更新
            </div>
        </footer>
    </div>

    <script>
        // 各伺服器開始時間定準 Epoch
        const SERVERS = [
            // time checked
            { name: "迦樓羅", epoch: 1769796000000 },
        ];
            // not check 
        /*
            { name: "巴哈姆特", epoch: 1769479200000 },
            { name: "泰坦", epoch: 1769652000000 },
            { name: "利維坦", epoch: 1769479200000 },
            { name: "伊佛利特", epoch: 1769565600000 },
            { name: "奧丁", epoch: 1769652000000 },
            { name: "鳳凰", epoch: 1769652000000 }
        */        

        const FETE_DURATION = 24 * 60 * 60 * 1000;
        const TOTAL_CYCLE = 72 * 60 * 60 * 1000;
        const FATE_INTERVAL = 2 * 60 * 60 * 1000;

        function formatDuration(ms) {
            const h = Math.floor(ms / 3600000).toString().padStart(2, '0');
            const m = Math.floor((ms % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((ms % 60000) / 1000).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function update() {
            const now = Date.now();
            let html = '';

            SERVERS.forEach(server => {
                // 處理循環邏輯 (確保即便現在時間小於 epoch 也能正確計算)
                let diff = now - server.epoch;
                let elapsed = ((diff % TOTAL_CYCLE) + TOTAL_CYCLE) % TOTAL_CYCLE;
                
                const isFeteActive = elapsed < FETE_DURATION;
                
                let statusBadge, stageTime, fateDisplay, fateColor;

                if (isFeteActive) {
                    const stageEnd = FETE_DURATION - elapsed;
                    const nextFate = FATE_INTERVAL - (elapsed % FATE_INTERVAL);
                    statusBadge = `<span class="badge-active px-3 py-1 rounded-full text-xs font-bold">進行中</span>`;
                    stageTime = `<span class="text-slate-400 text-[12px] ml-3 font-mono opacity-80">剩 ${formatDuration(stageEnd)}</span>`;
                    fateDisplay = formatDuration(nextFate);
                    fateColor = "text-yellow-400";
                } else {
                    const stageEnd = TOTAL_CYCLE - elapsed;
                    statusBadge = `<span class="badge-cooldown px-3 py-1 rounded-full text-xs font-bold">冷卻中</span>`;
                    stageTime = `<span class="text-slate-400 text-[12px] ml-3 font-mono opacity-60">剩 ${formatDuration(stageEnd)}</span>`;
                    fateDisplay = "-- : -- : --";
                    fateColor = "text-slate-700";
                }

                html += `
                    <tr class="hover:bg-white/[0.02] transition-all duration-300">
                        <td class="px-8 py-6 font-semibold text-slate-200">${server.name}</td>
                        <td class="px-8 py-6 whitespace-nowrap flex items-center h-full">
                            ${statusBadge}${stageTime}
                        </td>
                        <td class="px-8 py-6 text-right font-mono text-sm ${fateColor} tracking-tighter transition-colors duration-500">
                            ${fateDisplay}
                        </td>
                    </tr>
                `;
            });
            document.getElementById('serverTableBody').innerHTML = html;
        }
        
        // 每秒更新一次
        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
